# yamllint settings for the whole repo (tests/check_lint.sh, CI).
# Based on yamllint's defaults, with the settings ansible-lint requires.
extends: default

# Skip what Git ignores: local tool state such as .helm/ and .ansible/
ignore-from-file: .gitignore

rules:
  # Files start with a comment, not with "---"
  document-start: disable
  line-length:
    max: 120
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  # Required by ansible-lint
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
