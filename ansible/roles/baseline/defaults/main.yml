# Groups the admin user belongs to: sudo gives root with a password
baseline_admin_groups:
  - sudo
baseline_admin_shell: /bin/bash

# Fixed salt per node: the password hash stays identical between runs,
# so Ansible reports "ok" instead of "changed" every time (idempotence)
baseline_password_salt: "{{ inventory_hostname | hash('sha1') | truncate(16, true, '') }}"

# Accounts created by provider images, removed once the admin user exists
baseline_provider_users:
  - ubuntu
