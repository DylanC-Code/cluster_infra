# Handlers run once, at the end of the play, only if a task notified them.
# Reloading keeps the current SSH sessions open (including Ansible's).

- name: Reload SSH
  ansible.builtin.service:
    name: ssh
    state: reloaded

# Reads every file in /etc/sysctl.d, including ours
- name: Apply kernel settings
  ansible.builtin.command: sysctl --system
  changed_when: true

# Replaces our table in one step, without a moment with no rules
- name: Reload node firewall
  ansible.builtin.systemd_service:
    name: node_firewall
    state: reloaded
