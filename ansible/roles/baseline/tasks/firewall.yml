# Node firewall: same allowlist as the provider firewalls, enforced on the
# node itself (OVH's firewall doesn't filter traffic from other OVH servers).

- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

# Its stop action wipes every rule on the machine, Cilium's included
- name: Turn off Ubuntu's default nftables service
  ansible.builtin.service:
    name: nftables
    state: stopped
    enabled: false

# Checked with "nft -c" before being written: a broken file never goes live
- name: Write the firewall rules
  ansible.builtin.template:
    src: node_firewall.nft.j2
    dest: /etc/node_firewall.nft
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/nft -c -f %s
  notify: Reload node firewall

- name: Install the firewall service
  ansible.builtin.copy:
    src: node_firewall.service
    dest: /etc/systemd/system/node_firewall.service
    owner: root
    group: root
    mode: "0644"

- name: Start the firewall now and at every boot
  ansible.builtin.systemd_service:
    name: node_firewall
    state: started
    enabled: true
    daemon_reload: true
