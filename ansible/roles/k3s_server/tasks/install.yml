# The k3s binary at the pinned version, refused if its checksum differs.

- name: Download k3s
  ansible.builtin.get_url:
    url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version | urlencode }}/k3s"
    dest: "{{ k3s_server_binary }}"
    checksum: "sha256:{{ k3s_sha256 }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart k3s

# kubectl and the container tools on the node, for debugging
- name: Link the tools bundled in k3s
  ansible.builtin.file:
    src: "{{ k3s_server_binary }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
  loop:
    - kubectl
    - crictl
    - ctr
