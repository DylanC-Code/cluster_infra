# Admin access from the devcontainer. Run from ansible/:
#   ansible-playbook playbooks/kubeconfig.yaml
# kubectl then reaches https://127.0.0.1:6443 through the SSH tunnel (ktunnel).
# Rerun after a cluster rebuild: the certificates change.
- name: Fetch the cluster admin kubeconfig
  # Any one server holds the same file: the first is enough
  hosts: eu1_servers[0]
  gather_facts: false
  become: true
  tasks:
    - name: Read the kubeconfig k3s wrote on the node
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: kubeconfig_file
      no_log: true

    # k3s names everything "default"; "eu1" says which cluster kubectl talks to
    - name: Save it in the devcontainer as the eu1 context
      ansible.builtin.copy:
        content: >-
          {{ kubeconfig_file.content | b64decode
             | regex_replace('(?m)^(\s*(?:- )?(?:name|cluster|user|current-context): )default$', '\1eu1') }}
        dest: ~/.kube/config
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
