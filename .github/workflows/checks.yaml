# Every check of the repo (tests/run_all.sh) on each pull request, and on
# main after each merge. The tools come from the devcontainer's own install
# scripts and versions.env, so CI runs exactly the local versions.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the run still going
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Get the repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install the devcontainer's tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-venv
          sudo mkdir -p /tmp/devcontainer
          sudo cp .devcontainer/versions.env /tmp/devcontainer/
          for script in kubernetes_tools validation_tools python_tools; do
            sudo bash ".devcontainer/install/$script.sh"
          done
          echo /opt/python_tools/bin >> "$GITHUB_PATH"

      - name: Run every check
        run: bash tests/run_all.sh
