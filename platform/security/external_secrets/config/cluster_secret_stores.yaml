# The three stores, one per Bitwarden Secrets Manager project, each with its
# own read-only machine account (bootstrap/bitwarden_tokens.sh puts the
# tokens in the cluster). A store serves only the namespaces of its
# environment: the env label the ApplicationSets put on each namespace.
# Bitwarden's US cloud; Bitwarden is reached through its SDK server.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          env: platform
  provider:
    bitwardensecretsmanager:
      apiURL: https://api.bitwarden.com
      identityURL: https://identity.bitwarden.com
      bitwardenServerSDKURL: https://bitwarden-sdk-server.external-secrets.svc.cluster.local:9998
      caProvider:
        type: Secret
        name: bitwarden-tls-certs
        namespace: external-secrets
        key: ca.crt
      organizationID: dd929904-34ef-43b7-9f7d-b4fb009adb0c
      projectID: 86952ba9-4b9c-4fc2-9503-b4ff012be4ed
      auth:
        secretRef:
          credentials:
            name: bitwarden-platform-token
            namespace: external-secrets
            key: token
