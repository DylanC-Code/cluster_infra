# Barman Cloud plugin settings shared by every cluster.
# Cluster-specific ones: clusters/<name>/values/barman_cloud.yaml

# Resources named barman-cloud, not barman-cloud-plugin-barman-cloud
fullnameOverride: barman-cloud

# ---------- Copies: two, on different nodes ----------
# The operator asks the plugin before acting on any database that uses it,
# a failover included: with one copy, on the lost node, no failover runs
# (found by the failover test). Every copy serves the operator's calls;
# only the ObjectStore reconciliation runs on the elected leader.
replicaCount: 2
topologySpreadConstraints:
  - labelSelector:
      matchLabels:
        app.kubernetes.io/name: plugin-barman-cloud
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule

# Memory limit, no CPU limit (the CPU request guarantees its share)
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

# The operator talks to the plugin over mutual TLS: the chart makes its
# own issuer and certificates with cert-manager (renewed 15 days before
# their 90 days end)
