# The dashboards victoria_metrics gives Grafana (ADR 0005), read after
# values.yaml: a short set, each answering one question. The chart's sync
# job downloads them at each install or upgrade, and deletes the
# ConfigMaps of those turned off. Turn one back on when it's needed.
#   Kubernetes / Views (global, namespaces, pods, nodes): usage, by level
#   Node Exporter Full: one node's disk, network, memory in detail
#   etcd: the control plane's database
#   VictoriaMetrics cluster, VictoriaLogs: monitoring itself
# The home page, Cluster overview, is the grafana component's.
x-off: &off { enabled: false }

defaultDashboards:
  sources:
    # kube-prometheus' ~30 dashboards (k8s-resources-*, kubelet, apiserver,
    # Alertmanager, Windows...): the views above show what we read of them
    kube-prometheus: *off
    # VictoriaLogs' servers (victoria_logs), off by default because this
    # chart doesn't install them
    victorialogs-single-node:
      enabled: true

  dashboards:
    kubernetes-system-api-server: *off
    kubernetes-system-coredns: *off
    victoriametrics-operator: *off
    victoriametrics-vmagent: *off
    victoriametrics-vmalert: *off
