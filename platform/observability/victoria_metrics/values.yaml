# VictoriaMetrics settings shared by every cluster: metrics, alert rules,
# alert routing. Cluster-specific ones: clusters/<name>/values/victoria_metrics.yaml
# Every part runs 2 copies or more on different nodes: monitoring must
# survive the node loss it is there to report.
fullnameOverride: vm
# One copy per node at most, while another node has none (used below)
x-spread: &spread { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: DoNotSchedule }

# ---------- Storage: every sample on 2 of the 3 nodes ----------
vmsingle:
  enabled: false
vmcluster:
  enabled: true
  spec:
    retentionPeriod: 30d
    replicationFactor: 2
    vmstorage:
      replicaCount: 3
      storage:
        volumeClaimTemplate:
          spec:
            resources:
              requests:
                storage: 10Gi
      # The two vmagents scrape the same targets: keep one sample per 30 s
      extraArgs:
        dedup.minScrapeInterval: 30s
      topologySpreadConstraints:
        - <<: *spread
          labelSelector: { matchLabels: { app.kubernetes.io/name: vmstorage } }
      podDisruptionBudget:
        maxUnavailable: 1
      # VictoriaMetrics sizes its caches from this limit (60 % of it):
      # 768 Mi is plenty for this cluster and keeps the nodes' memory free
      resources:
        requests: { cpu: 50m, memory: 384Mi }
        limits: { memory: 768Mi }
    vmselect:
      replicaCount: 2
      extraArgs:
        dedup.minScrapeInterval: 30s
      topologySpreadConstraints:
        - <<: *spread
          labelSelector: { matchLabels: { app.kubernetes.io/name: vmselect } }
      podDisruptionBudget:
        maxUnavailable: 1
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits: { memory: 512Mi }
    vminsert:
      replicaCount: 2
      topologySpreadConstraints:
        - <<: *spread
          labelSelector: { matchLabels: { app.kubernetes.io/name: vminsert } }
      podDisruptionBudget:
        maxUnavailable: 1
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits: { memory: 512Mi }

# ---------- Scraping: two agents, the same targets ----------
vmagent:
  spec:
    replicaCount: 2
    scrapeInterval: 30s
    topologySpreadConstraints:
      - <<: *spread
        labelSelector: { matchLabels: { app.kubernetes.io/name: vmagent } }
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }

# ---------- Alerts: two evaluators, two clustered alertmanagers ----------
vmalert:
  spec:
    replicaCount: 2
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { memory: 256Mi }
alertmanager:
  spec:
    replicaCount: 2
    disableNamespaceMatcher: true # routing: config/, for every namespace
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }

# ---------- k3s: one process, one set of metrics ----------
# k3s runs the API server, scheduler, controller manager and kubelet in one
# process, sharing one metrics registry: every one of their endpoints serves
# all of them (~180,000 series each). So each metric is read once:
# - the API server's endpoint keeps the API server's and the controllers';
# - the kubelet's keeps only its own (and cAdvisor's, on its own path);
# - the controller manager and scheduler aren't scraped on their own.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubelet:
  vmScrape:
    spec:
      metricRelabelConfigs:
        - { action: labeldrop, regex: (uid) }
        - { action: labeldrop, regex: (id|name) }
        - { action: drop, source_labels: [__name__], regex: rest_client_request_duration_seconds_(bucket|sum|count) }
        # The API server's metrics, served again by the kubelet endpoint
        - { action: drop, source_labels: [__name__], regex: (apiserver|etcd|scheduler|workqueue)_.+ }
        - { action: drop, source_labels: [__name__], regex: (apiextensions|aggregator|admission|flowcontrol)_.+ }
        - { action: drop, source_labels: [__name__], regex: (authentication|authorization|watch_cache)_.+ }
kubeApiServer:
  vmScrape:
    spec:
      endpoints:
        - port: https
          scheme: https
          bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          tlsConfig:
            caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            serverName: kubernetes
          # Every API server and etcd-client histogram but the one the latency
          # alerts use: the biggest series, read by no rule (_sum and _count stay)
          metricRelabelConfigs:
            - action: drop
              if: '{__name__=~"(apiserver|etcd)_.+_bucket", __name__!="apiserver_request_sli_duration_seconds_bucket"}'
# etcd: on 2381 (plain HTTP, k3s_server role), at the nodes' addresses
kubeEtcd:
  service:
    port: 2381
    targetPort: 2381
  vmScrape:
    spec:
      endpoints:
        - port: http-metrics
          scheme: http

# ---------- Node exporter: instance = the node's name, not its IP ----------
prometheus-node-exporter:
  vmScrape:
    spec:
      endpoints:
        - port: metrics
          relabelConfigs:
            - { action: replace, source_labels: [__meta_kubernetes_pod_node_name], target_label: instance }
          metricRelabelConfigs:
            - { action: drop, source_labels: [mountpoint], regex: /var/lib/kubelet/pods.+ }
# Grafana is observability/grafana: this chart only gives its data source and dashboards
grafana:
  enabled: false
  forceDeployDatasource: true
