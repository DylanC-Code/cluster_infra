# etcd's alert on slow member round trips, in place of the chart's
# (rules.yaml). Members in different sites normally take 0.1 to 0.2 s at
# the 99th percentile, past the chart's 0.15 s. 0.3 s, over 15 minutes,
# still says when a link is really degraded: writes slow down for the
# whole cluster then.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: etcd
spec:
  groups:
    - name: etcd.sites
      rules:
        - alert: etcdMemberCommunicationSlow
          expr: >-
            histogram_quantile(0.99,
            rate(etcd_network_peer_round_trip_time_seconds_bucket{job=~".*etcd.*"}[5m])) > 0.3
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: etcd cluster member communication is slow.
            description: >-
              etcd member {{ $labels.instance }} takes {{ $value | humanizeDuration }}
              (99th percentile) to reach member {{ $labels.To }}.
