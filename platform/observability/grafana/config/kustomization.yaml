# Installed after Grafana's chart (platform-config ApplicationSet): the
# dashboards this component keeps itself, as ConfigMaps Grafana's sidecar
# loads. Each is exported from Grafana's UI (ADR 0006).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  # Grafana's home page (grafana.ini, values.yaml)
  - name: grafana-dashboard-overview
    files:
      - overview.dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
