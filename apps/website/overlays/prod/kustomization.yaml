# The website in prod: dylancastor.com, public (no Cloudflare Access).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - www_redirect.yaml
# The image it runs: main at one exact digest. Renovate proposes the next
# digest as a pull request when main moves; merging it deploys, reverting it
# rolls back (.github/renovate.json5). Tag and digest in one value: Renovate
# skips an image that sets `digest` beside `newTag`
images:
  - name: ghcr.io/dylanc-code/dylancastor-site
    newTag: main@sha256:476a07a5c2c5a5cb1b4df98978be4fc02b8177b72ac4ef42319bbbbeb2418473
patches:
  - target: { kind: Deployment, name: web }
    patch: |-
      - { op: replace, path: /spec/template/spec/priorityClassName, value: app-prod }
  - target: { kind: HTTPRoute, name: web }
    patch: |-
      - { op: replace, path: /spec/hostnames, value: [dylancastor.com] }
