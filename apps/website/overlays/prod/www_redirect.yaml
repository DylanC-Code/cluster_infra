# www.dylancastor.com sends visitors to dylancastor.com, the same path, for
# good (301): one address per page, for visitors and search engines.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: www-redirect
spec:
  parentRefs:
    - { name: traefik, namespace: traefik }
  hostnames:
    - www.dylancastor.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: dylancastor.com
            statusCode: 301
