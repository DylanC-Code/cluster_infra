# Traefik's Gateway to the pages. The overlay sets the hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
spec:
  parentRefs:
    - { name: traefik, namespace: traefik }
  hostnames:
    - set-by-the-overlay
  rules:
    - backendRefs:
        - { name: web, port: 80 }
