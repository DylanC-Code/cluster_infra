# The pages, served by static-web-server (the image's sws.toml): two
# copies, never on the same node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      priorityClassName: app-prod # the overlay sets its environment's
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          # Counts this version's pods only: a rollout can't leave two on one node
          matchLabelKeys: [pod-template-hash]
          labelSelector: { matchLabels: { app.kubernetes.io/name: web } }
      # The image runs as root unless told: any user can read the pages
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: ghcr.io/dylanc-code/dylancastor-site # the overlay sets the commit
          ports:
            - { name: http, containerPort: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            failureThreshold: 3
          # Pages are compressed per request (sws.toml): it uses 35 to 55 Mi,
          # and a burst went over the 64 Mi limit (OOMKilled, 2026-11-25)
          resources:
            requests: { cpu: 10m, memory: 48Mi }
            limits: { memory: 128Mi }
